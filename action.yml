name: sprocguard verify
description: Fail a pull request when a SQL Server stored procedure behaves differently than on the base branch or its baseline.
author: Jheyson Huarauya Riquelme
branding:
  icon: shield
  color: blue

inputs:
  mode:
    description: '"committed" verifies against the baselines committed in the repository. "base-branch" captures baselines from the base branch in the same run (needs cases and setup-scripts), so nothing has to be committed.'
    required: false
    default: committed
  cases:
    description: Cases files or folders, one per line, used by mode "base-branch". Each file is named after its procedure (usp_PlaceOrder.json is dbo.usp_PlaceOrder).
    required: false
    default: ""
  base-ref:
    description: Branch, tag or commit to capture the baselines from in mode "base-branch". Defaults to the pull request's base branch.
    required: false
    default: ${{ github.base_ref }}
  base-setup-scripts:
    description: Scripts that build the database on the base branch, in mode "base-branch". Defaults to setup-scripts.
    required: false
    default: ""
  fail-on-change:
    description: Set to "false" to report behavior changes in the job summary without failing the step.
    required: false
    default: "true"
  config:
    description: Path to your sprocguard.toml. Its [safety] and [storage] settings are used as they are; the connection is replaced by the throwaway server.
    required: false
    default: sprocguard.toml
  setup-scripts:
    description: T-SQL scripts that build the database (schema, seed data, procedures), one per line, run in order with sqlcmd. Glob patterns such as db/procedures/*.sql are allowed.
    required: false
    default: ""
  procedures:
    description: Procedures to verify, separated by spaces or new lines. Empty means every baseline.
    required: false
    default: ""
  database:
    description: Database to create and verify. Defaults to the first entry of [safety].allowed_databases.
    required: false
    default: ""
  verify:
    description: Run sprocguard verify. Set to "false" to only prepare the server, so later steps can run sprocguard commands themselves.
    required: false
    default: "true"
  start-sql-server:
    description: Start a throwaway SQL Server in Docker. Set to "false" in later steps of the same job to reuse the server started by an earlier step.
    required: false
    default: "true"
  sql-server-image:
    description: SQL Server container image.
    required: false
    default: mcr.microsoft.com/mssql/server:2022-latest
  python-version:
    description: Python version used to run sprocguard.
    required: false
    default: "3.12"

outputs:
  passed:
    description: '"true" if every procedure behaves as in its baseline, "false" if any changed. Empty when verify is "false".'
    value: ${{ steps.verify.outputs.passed }}
  report:
    description: Path to the Markdown report (also added to the job summary).
    value: ${{ steps.verify.outputs.report }}

runs:
  using: composite
  steps:
    - name: Check the runner
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "::error title=sprocguard::This action runs SQL Server in a Linux container. Use a Linux runner such as ubuntu-latest."
        exit 1

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install sprocguard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        venv="$RUNNER_TEMP/sprocguard-venv"
        if [ ! -x "$venv/bin/sprocguard" ]; then
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check "${ACTION_PATH}[pymssql]"
        fi
        echo "$venv/bin" >> "$GITHUB_PATH"
        "$venv/bin/sprocguard" --version

    - name: Read the configuration
      id: settings
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        DATABASE: ${{ inputs.database }}
      run: |
        python_bin="$RUNNER_TEMP/sprocguard-venv/bin/python"
        database="$("$python_bin" - <<'PY'
        import os, sys, tomllib
        path = os.environ["CONFIG"]
        try:
            with open(path, "rb") as fh:
                data = tomllib.load(fh)
        except FileNotFoundError:
            sys.exit(f"sprocguard: configuration file not found: {path}")
        database = os.environ.get("DATABASE") or next(
            iter(data.get("safety", {}).get("allowed_databases", [])), ""
        )
        if not database:
            sys.exit("sprocguard: set the database input or [safety].allowed_databases.")
        print(database)
        PY
        )"
        echo "database=$database" >> "$GITHUB_OUTPUT"
        echo "SPROCGUARD_CONFIG=$CONFIG" >> "$GITHUB_ENV"

    - name: Start SQL Server
      if: inputs.start-sql-server == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.sql-server-image }}
        DATABASE: ${{ steps.settings.outputs.database }}
      run: |
        password="Sg-$(openssl rand -hex 16)-A1"
        echo "::add-mask::$password"
        docker run --detach --name sprocguard-sql --publish 1433:1433 \
          --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD="$password" \
          "$IMAGE" > /dev/null

        sqlcmd=""
        for _ in $(seq 1 90); do
          for candidate in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
            if docker exec sprocguard-sql "$candidate" -S localhost -U sa -P "$password" -C -b \
                 -Q "SELECT 1" > /dev/null 2>&1; then
              sqlcmd="$candidate"
              break 2
            fi
          done
          sleep 2
        done
        if [ -z "$sqlcmd" ]; then
          docker logs sprocguard-sql | tail -n 40
          echo "::error title=sprocguard::SQL Server did not start within 3 minutes."
          exit 1
        fi

        quoted="${DATABASE//]/]]}"
        literal="${DATABASE//\'/\'\'}"
        docker exec sprocguard-sql "$sqlcmd" -S localhost -U sa -P "$password" -C -b \
          -Q "IF DB_ID(N'$literal') IS NULL CREATE DATABASE [$quoted];"

        {
          echo "SPROCGUARD_SERVER=localhost"
          echo "SPROCGUARD_PORT=1433"
          echo "SPROCGUARD_USER=sa"
          echo "SPROCGUARD_PASSWORD=$password"
          echo "SPROCGUARD_DATABASE=$DATABASE"
          echo "SPROCGUARD_SQLCMD=$sqlcmd"
        } >> "$GITHUB_ENV"
        echo "SQL Server is ready with an empty database [$DATABASE]."

    - name: Check the inputs
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CASES: ${{ inputs.cases }}
        BASE_REF: ${{ inputs.base-ref }}
        SCRIPTS: ${{ inputs.setup-scripts }}
      run: |
        case "$MODE" in
          committed) ;;
          base-branch)
            missing=""
            [ -z "$(echo "$CASES" | xargs)" ] && missing="$missing cases"
            [ -z "$(echo "$SCRIPTS" | xargs)" ] && missing="$missing setup-scripts"
            [ -z "$BASE_REF" ] && missing="$missing base-ref (it is only automatic on pull_request events)"
            [ -z "${SPROCGUARD_SQLCMD:-}" ] && missing="$missing start-sql-server"
            if [ -n "$missing" ]; then
              echo "::error title=sprocguard::mode base-branch needs:$missing"
              exit 1
            fi
            ;;
          *)
            echo "::error title=sprocguard::Unknown mode '$MODE'. Use committed or base-branch."
            exit 1
            ;;
        esac

    - name: Check out the base branch
      if: inputs.mode == 'base-branch'
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        base_dir="$RUNNER_TEMP/sprocguard-base"
        if [ -d "$base_dir" ]; then
          git worktree remove --force "$base_dir"
        fi
        git fetch --no-tags --depth=1 origin "$BASE_REF"
        git worktree add --detach "$base_dir" FETCH_HEAD
        echo "Base branch $BASE_REF is at $(git -C "$base_dir" rev-parse --short HEAD)."

    - name: Build the database from the base branch
      if: inputs.mode == 'base-branch'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_SCRIPTS: ${{ inputs.base-setup-scripts }}
        SCRIPTS: ${{ inputs.setup-scripts }}
        DATABASE: ${{ steps.settings.outputs.database }}
      run: |
        bash "$ACTION_PATH/action/run-scripts.sh" "$RUNNER_TEMP/sprocguard-base" "${BASE_SCRIPTS:-$SCRIPTS}"

    - name: Capture baselines on the base branch
      id: capture
      if: inputs.mode == 'base-branch'
      shell: bash
      env:
        CASES: ${{ inputs.cases }}
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        baselines="$RUNNER_TEMP/sprocguard-baselines"
        rm -rf "$baselines"
        export SPROCGUARD_BASELINE_DIR="$baselines"
        echo "SPROCGUARD_BASELINE_DIR=$baselines" >> "$GITHUB_ENV"

        shopt -s nullglob globstar
        paths=()
        while IFS= read -r pattern; do
          pattern="$(echo "$pattern" | xargs)"
          [ -z "$pattern" ] && continue
          # shellcheck disable=SC2206
          matches=( $pattern )
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error title=sprocguard::No cases file or folder matches '$pattern'."
            exit 1
          fi
          paths+=( "${matches[@]}" )
        done <<< "$CASES"

        sprocguard capture-cases --skip-missing --overwrite "${paths[@]}"
        captured=$(find "$baselines" -name '*.json' 2>/dev/null | wc -l)
        echo "captured=$captured" >> "$GITHUB_OUTPUT"
        echo "Captured $captured baseline(s) on $BASE_REF."

    - name: Reset the database
      if: inputs.mode == 'base-branch'
      shell: bash
      env:
        DATABASE: ${{ steps.settings.outputs.database }}
      run: |
        quoted="${DATABASE//]/]]}"
        literal="${DATABASE//\'/\'\'}"
        docker exec sprocguard-sql "$SPROCGUARD_SQLCMD" -S localhost -U sa \
          -P "$SPROCGUARD_PASSWORD" -C -b -d master -Q "
            IF DB_ID(N'$literal') IS NOT NULL
            BEGIN
              ALTER DATABASE [$quoted] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
              DROP DATABASE [$quoted];
            END;
            CREATE DATABASE [$quoted];"
        echo "Database [$DATABASE] recreated for the pull request's scripts."

    - name: Run setup scripts
      if: inputs.setup-scripts != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCRIPTS: ${{ inputs.setup-scripts }}
        DATABASE: ${{ steps.settings.outputs.database }}
      run: |
        bash "$ACTION_PATH/action/run-scripts.sh" "$GITHUB_WORKSPACE" "$SCRIPTS"

    - name: Verify procedures
      id: verify
      if: inputs.verify == 'true'
      shell: bash
      env:
        PROCEDURES: ${{ inputs.procedures }}
        MODE: ${{ inputs.mode }}
        BASE_REF: ${{ inputs.base-ref }}
        CAPTURED: ${{ steps.capture.outputs.captured }}
        FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
      run: |
        report="$RUNNER_TEMP/sprocguard-report.md"
        read -r -a names <<< "$(echo "$PROCEDURES" | tr '\n' ' ')"

        if [ "$MODE" = "base-branch" ]; then
          if [ "${CAPTURED:-0}" = "0" ]; then
            echo "None of the procedures in the cases files exist on $BASE_REF yet: nothing to compare." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "_Baselines captured on \`$BASE_REF\` in this run._" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
        fi

        set +e
        sprocguard verify --markdown-report "$report" "${names[@]}"
        code=$?
        set -e

        if [ -f "$report" ]; then
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"
        fi
        case "$code" in
          0) echo "passed=true" >> "$GITHUB_OUTPUT" ;;
          2)
            echo "passed=false" >> "$GITHUB_OUTPUT"
            if [ "$FAIL_ON_CHANGE" != "true" ]; then
              echo "::warning title=sprocguard::A stored procedure no longer behaves like its baseline. See the job summary for the differences."
              exit 0
            fi
            echo "::error title=sprocguard::A stored procedure no longer behaves like its baseline. See the job summary for the differences."
            ;;
        esac
        exit "$code"
