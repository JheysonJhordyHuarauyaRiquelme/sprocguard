[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sprocguard"
version = "0.1.0"
description = "A safety net for SQL Server stored procedures: capture what a procedure does today, then verify an AI agent (or a human) didn't change it by accident."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jheyson Huarauya Riquelme" }]
keywords = ["sql-server", "t-sql", "stored-procedures", "tsqlt", "mcp", "ai-agents", "characterization-tests", "golden-master"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: SQL",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=2.0",
  "pyodbc>=5.0",
]

[project.optional-dependencies]
pymssql = ["pymssql>=2.3"]
dev = ["pytest>=8", "sqlglot>=25"]

[project.scripts]
sprocguard = "sprocguard.cli:main"

[project.urls]
Homepage = "https://github.com/JheysonJhordyHuarauyaRiquelme/sprocguard"
Issues = "https://github.com/JheysonJhordyHuarauyaRiquelme/sprocguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sprocguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
