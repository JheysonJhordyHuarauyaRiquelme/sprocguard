name: Feature request
description: Suggest an idea or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like sprocguard to do?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
